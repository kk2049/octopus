      "roles": [
        "owner",
        "editor",
        "researcher",
        "viewer"
      ],
      "params": {
        "source": {
          "type": "string",
          "max": 320,
          "required": false,
          "description": "可选来源 ref"
        }
      }
    },
    "workflow_trace": {
      "binding": "resource",
      "title": "按来源或对象双向查询已经生效的改动和建议",
      "description": "按来源或对象双向查询已经生效的改动和建议",
