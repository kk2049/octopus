<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Octopus · 正在连接</title>
    <link rel="stylesheet" href="/__octopus/startup/loading.css">
    <script type="module" src="/__octopus/startup/loading.js"></script>
  </head>
  <body>
    <main>
      <div class="wordmark">OCTOPUS</div>
      <div class="spinner" aria-hidden="true"></div>
      <h1 id="status" aria-live="polite">服务正在启动</h1>
      <p id="hint">请稍候，连接恢复后会自动回到当前页面。</p>
      <button type="button" id="retry">重新连接</button>
      <noscript>请稍后手动刷新页面。</noscript>
    </main>
  </body>
</html>
