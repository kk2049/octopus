<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent View 预览</title>
    <style>
      /*
       * The document chrome only. Everything inside `#root` is styled by the
       * standard shell and by whichever modules the draft mounts — a preview
       * that brought its own theme would be showing something the release does
       * not look like.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--av-fg, #1d2430);
        background: var(--av-canvas, #f5f7fa);
      }

      #root {
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 9px 11px;
        box-sizing: border-box;
      }

      .preview-head {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 2px 3px 6px;
      }

      .preview-head span {
        color: var(--av-muted, #687386);
        font-size: 11.5px;
      }

      .preview-custom-root {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
