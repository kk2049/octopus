<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨报样机 v5 · 2026-07-24</title>
<style>
  :root {
    --fg:#1c1e21; --muted:#667; --line:#e3e5e8; --card:#fff; --bg:#f5f6f8; --accent:#2563eb;
    --crit:#d03b3b; --warn:#eda100; --run:#2563eb; --done:#0ca30c; --idle:#9aa3ad;
    --sel:rgba(37,99,235,.09); --band:rgba(37,99,235,.06); --recap:#f0f2f6;
    --spark:#c3d6f5; --flash:rgba(250,204,21,.45); --mile:#7c6cd6; --future:#9aa3ad;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e5e7eb; --muted:#9aa; --line:#333842; --card:#1b1e24; --bg:#12141a;
      --run:#3987e5; --warn:#c98500; --sel:rgba(57,135,229,.16); --band:rgba(57,135,229,.10);
      --recap:#22262e; --spark:#2c4568; --flash:rgba(250,204,21,.28); --mile:#9085e9; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--fg); background:var(--bg); display:flex; flex-direction:column; }
  a { color:var(--accent); }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.92em; }

  .mockbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:6px 14px;
             background:var(--card); border-bottom:1px dashed var(--accent); font-size:12.5px; color:var(--muted); }
  .mockbar b { color:var(--accent); }
  .tt { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .tt button { font:inherit; font-size:12px; padding:2px 10px; border:1px solid var(--line);
               background:var(--bg); color:var(--muted); border-radius:999px; cursor:pointer; }
  .tt button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .shell { display:flex; gap:18px; align-items:center; padding:0 14px; height:38px; flex:none;
           background:var(--card); border-bottom:1px solid var(--line); font-size:13px; }
  .shell .brand { font-weight:600; }
  .shell a { color:var(--muted); text-decoration:none; }
  .shell a.active { color:var(--fg); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent); }
  .shell .who { margin-left:auto; color:var(--muted); font-size:12px; }

  .app { flex:1; display:flex; min-height:0; }

  /* ═══ 左栏:项目(一级) + 时间线(二级导航) ═══ */
  .rail { width:262px; flex:none; border-right:1px solid var(--line); background:var(--card);
          display:flex; flex-direction:column; min-height:0; }
  .rail-head { padding:10px 14px 9px; border-bottom:1px solid var(--line); }
  .rail-head .d { font-weight:600; font-size:13px; }
  .rail-head .sum { font-size:12px; color:var(--muted); margin-top:1px; }
  .rail-head .sum .live { color:var(--run); }
  .rail-list { flex:1; overflow-y:auto; padding:4px 0 10px; }
  .rail-foot { border-top:1px solid var(--line); padding:7px 14px; font-size:11.5px; color:var(--muted); }
  .rail-foot a { color:var(--accent); text-decoration:none; }
  .rail-sep { padding:9px 14px 3px; font-size:11px; color:var(--muted); }

  .row { padding:6px 14px; cursor:pointer; border-left:2px solid transparent; }
  .row:hover { background:var(--sel); }
  .row.on { background:var(--sel); border-left-color:var(--accent); }
  .row .l1 { display:flex; align-items:center; gap:7px; }
  .row .nm { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .l2 { display:flex; gap:8px; margin-top:1px; padding-left:15px; font-size:11.5px; color:var(--muted); }
  .row .l2 .ddl { margin-left:auto; flex:none; font-variant-numeric:tabular-nums; }
  .row.calm .nm { color:var(--muted); }
  .row.home .nm { font-family:inherit; font-size:13px; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.done{background:var(--done)}
  .dot.idle{background:var(--idle)} .dot.run{background:var(--run); animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .new { width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; margin-left:auto; }

  /* 二级:线性时间线 */
  .tlnav { margin:3px 0 8px 27px; padding-left:15px; border-left:1.5px solid var(--line); }
  .tlg { font-size:10.5px; color:var(--muted); letter-spacing:.08em; margin:6px 0 2px -15px;
         padding-left:15px; display:flex; align-items:baseline; }
  .tlg .more { margin-left:auto; padding-right:10px; color:var(--accent); cursor:pointer; letter-spacing:0; }
  .tnode { position:relative; display:flex; gap:7px; align-items:baseline; cursor:pointer;
           padding:2.5px 10px 2.5px 0; font-size:12px; line-height:1.5; }
  .tnode:hover { background:var(--sel); }
  .tnode .g { position:absolute; left:-21px; width:13px; text-align:center; font-size:9px;
              background:var(--card); line-height:1.5; }
  .tnode .dt { flex:none; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .tnode .x { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tnode.past .g { color:var(--muted); }
  .tnode.mile .g { color:var(--mile); }
  .tnode.now { padding:5px 10px 5px 0; }
  .tnode.now .g { color:var(--run); font-size:12px; }
  .tnode.now .x { color:var(--fg); font-weight:600; }
  .tnode.now .sub { display:block; font-weight:400; color:var(--muted); font-size:11px; }
  .tnode.fut { color:var(--future); } .tnode.fut .g { color:var(--future); }
  .tnode.fut.ddl .g { color:var(--crit); }
  .tnode.on { background:var(--sel); }
  .tnode.on .x { color:var(--accent); font-weight:600; }
  .tnode.on::after { content:""; position:absolute; left:-22.5px; top:0; bottom:0;
                     border-left:2px solid var(--accent); }

  /* ═══ 中栏 ═══ */
  .pane { flex:1; overflow-y:auto; min-width:0; }
  .doc { max-width:66ch; margin:0 auto; padding:24px 26px 70px; }
  .band { background:var(--band); border:1px solid var(--line); border-radius:8px;
          padding:8px 12px; font-size:12.5px; margin-bottom:20px; }
  .band b { color:var(--accent); }
  h1.t { font-size:18px; margin:0 0 3px; }
  h1.t.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:18px; }
  .crumb { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .crumb a { text-decoration:none; }

  .recap { background:var(--recap); border-radius:9px; padding:12px 14px; margin-bottom:22px; }
  .recap .r { display:flex; gap:10px; font-size:14px; line-height:1.7; }
  .recap .r + .r { margin-top:4px; }
  .recap .k { flex:none; width:3.5em; color:var(--muted); font-size:12.5px; padding-top:2px; }
  .recap.slim { padding:9px 13px; font-size:13px; }

  .who-chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line);
              background:var(--card); border-radius:999px; padding:1px 9px; font-size:12.5px;
              margin-right:5px; cursor:pointer; color:var(--fg); }
  .who-chip:hover { border-color:var(--accent); color:var(--accent); }
  .who-chip .fs { color:#3370ff; font-weight:700; font-size:11px; }
  .who-chip.ghost { border-style:dashed; color:var(--muted); }

  /* 当前段 */
  .seg-h { display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .seg-h h2 { font-size:16px; margin:0; }
  .seg-h .act { margin-left:auto; }
  .btn { font:inherit; font-size:12.5px; padding:4px 12px; border:1px solid var(--line);
         background:var(--card); color:var(--fg); border-radius:7px; cursor:pointer; }
  .btn.p { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:hover { border-color:var(--accent); }
  .seg-meta { font-size:12.5px; color:var(--muted); margin-bottom:18px; }

  .grp { margin-bottom:18px; }
  .grp h3 { font-size:12px; color:var(--muted); font-weight:600; margin:0 0 6px;
            display:flex; align-items:baseline; gap:7px; }
  .grp h3 .c { color:var(--fg); }
  .li { display:flex; gap:9px; padding:7px 11px; border:1px solid var(--line); border-radius:8px;
        margin-bottom:6px; font-size:14px; line-height:1.65; }
  .li .g { flex:none; font-size:12px; padding-top:2px; }
  .li .body { flex:1; }
  .li .meta { font-size:12px; color:var(--muted); margin-top:1px; }
  .li .ax { margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; }
  .li .ax .btn { font-size:12px; padding:2px 9px; }
  .li.block { border-color:var(--crit); }
  .li.block .g { color:var(--crit); }
  .li.verify { border-color:var(--warn); }
  .li.verify .g { color:var(--warn); }
  .li.run .g { color:var(--run); }
  .li.todo { border-style:dashed; color:var(--muted); }

  .opts { border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-top:6px; }
  .opt { padding:9px 13px; } .opt + .opt { border-top:1px solid var(--line); }
  .opt .t { font-weight:600; font-size:14px; }
  .opt .d { color:var(--muted); font-size:13px; }
  .opt .rec { font-size:11.5px; color:var(--accent); border:1px solid var(--accent);
              border-radius:999px; padding:0 7px; margin-left:6px; white-space:nowrap; }

  .dr { display:flex; gap:10px; font-size:14px; line-height:1.75; margin-bottom:5px; }
  .dr .dk { flex:none; width:3.4em; color:var(--muted); font-size:12.5px; padding-top:2px; }
  .quote { border-left:2px solid var(--line); padding-left:11px; color:var(--muted); font-size:14px; }
  .ev { color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--muted); font-size:13px; }
  .ev:hover { color:var(--accent); border-bottom-color:var(--accent); }
  .tail { border-top:1px solid var(--line); margin-top:26px; padding-top:12px; font-size:12.5px; color:var(--muted); }
  .tail summary { cursor:pointer; list-style:none; }
  .tail details summary::before { content:"▸ "; }
  .tail details[open] summary::before { content:"▾ "; }
  .tail pre { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; background:var(--bg);
              border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; margin:8px 0; }
  .tail .add{color:#0a7d0a} .tail .del{color:var(--crit)}

  .keys { margin-bottom:26px; }
  .keys .ki { display:flex; gap:9px; font-size:14.5px; line-height:1.7; margin-bottom:5px; }
  .keys .n { flex:none; color:var(--muted); font-variant-numeric:tabular-nums; }
  .item { border-top:1px solid var(--line); padding:14px 0 4px; }
  .item .ih { display:flex; align-items:baseline; gap:8px; margin-bottom:7px; cursor:pointer; }
  .item .ih .nm { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; font-weight:600; }
  .item .ih .st { font-size:12px; color:var(--muted); margin-left:auto; flex:none; }
  .item .ln { display:flex; gap:10px; font-size:14px; line-height:1.72; margin-bottom:3px; }
  .item .ln .k { flex:none; width:4.2em; color:var(--muted); font-size:12.5px; padding-top:2px; }
  .item.calm .nm { font-weight:400; color:var(--muted); }
  .flash { animation:fl 1.6s ease-out; border-radius:3px; }
  @keyframes fl { 0%,25%{background:var(--flash)} 100%{background:transparent} }

  /* ═══ 右栏 ═══ */
  .chat { width:340px; flex:none; border-left:1px solid var(--line); background:var(--card);
          display:flex; flex-direction:column; min-height:0; }
  .chat-head { padding:9px 14px; border-bottom:1px solid var(--line); }
  .chat-head .t { font-size:13px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .chat-head .t .dot { background:var(--done); }
  .chat-head .ctx { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .chat-head .ctx code { color:var(--accent); }
  .msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .m { font-size:13.5px; line-height:1.68; }
  .m.a .who { font-size:11px; color:var(--muted); display:block; margin-bottom:2px; }
  .m.u { align-self:flex-end; max-width:86%; background:var(--sel); border-radius:11px 11px 3px 11px; padding:7px 11px; }
  .m .flagged { background:var(--band); border-left:2px solid var(--accent); padding:7px 10px;
                border-radius:0 6px 6px 0; margin-top:5px; }
  .wrote { border:1px solid var(--line); border-radius:7px; padding:7px 10px; margin-top:6px;
           font-size:12.5px; color:var(--muted); }
  .wrote .h { color:var(--fg); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 8px; }
  .chip { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--line);
          background:var(--bg); color:var(--accent); border-radius:999px; cursor:pointer; text-align:left; }
  .chip:hover { border-color:var(--accent); }
  .composer { border-top:1px solid var(--line); padding:9px 12px; display:flex; gap:8px; }
  .composer input { flex:1; font:inherit; font-size:13px; padding:7px 10px; border:1px solid var(--line);
                    border-radius:8px; background:var(--bg); color:var(--fg); }
  .composer button { font:inherit; font-size:13px; padding:0 13px; border:none; border-radius:8px;
                     background:var(--accent); color:#fff; cursor:pointer; }
  .chat-toggle { display:none; }

  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30;
           background:var(--fg); color:var(--bg); border-radius:8px; padding:8px 15px; font-size:13px;
           opacity:0; pointer-events:none; transition:opacity .18s; max-width:80vw; text-align:center; }
  #toast.show { opacity:.95; }

  @media (max-width:1240px) {
    .chat { position:fixed; right:0; top:0; bottom:0; z-index:25; transform:translateX(100%);
            transition:transform .18s; box-shadow:-8px 0 24px rgba(0,0,0,.12); }
    .chat.open { transform:none; }
    .chat-toggle { display:block; position:fixed; right:16px; bottom:16px; z-index:24; border:none;
                   background:var(--accent); color:#fff; border-radius:999px; padding:9px 16px;
                   font:inherit; font-size:13px; cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,.18); }
  }
  @media (max-width:760px) {
    .app { flex-direction:column; }
    .rail { width:auto; border-right:none; border-bottom:1px solid var(--line); max-height:44vh; }
    .doc { padding:18px 16px 60px; }
    .chat { width:100%; }
  }
</style>
</head>
<body>

<div class="mockbar">
  🎭 <b>静态样机 v5</b> · 数据虚构 · <a href="/v1.html">v1</a>
  <span class="tt"><span>时间旅行:</span>
    <button data-t="09:00" class="on" onclick="setTime('09:00')">09:00 晨读</button>
    <button data-t="12:30" onclick="setTime('12:30')">12:30</button>
    <button data-t="16:00" onclick="setTime('16:00')">16:00</button></span>
</div>
<div class="shell">
  <span class="brand">octopus</span>
  <a href="#" onclick="toast('壳层示意 — 正式版由 shell.ts 提供');return false">总览</a>
  <a href="#" onclick="toast('壳层示意 — 正式版跳会话浏览器');return false">会话</a>
  <a href="#" class="active">工作台</a>
  <span class="who">lht · dt_••••</span>
</div>

<div class="app">
  <nav class="rail">
    <div class="rail-head"><div class="d">07-24 周五</div><div class="sum" id="rh-sum"></div></div>
    <div class="rail-list" id="rail"></div>
    <div class="rail-foot" id="rail-foot"></div>
  </nav>
  <main class="pane" id="pane"></main>
  <aside class="chat" id="chat">
    <div class="chat-head"><div class="t"><span class="dot"></span>秘书 · 会话保持中</div>
      <div class="ctx" id="chat-ctx"></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>

      <input id="inp" placeholder="纠正它、问它依据、改事实…" onkeydown="if(event.key==='Enter')send()">

</div>
<button class="chat-toggle" onclick="document.getElementById('chat').classList.toggle('open')">💬 秘书</button>

<script>
const PEOPLE = { you:{n:'你',oid:null}, chen:{n:'Prof. Chen',oid:'ou_9f2c…a41'}, li:{n:'小李',oid:'ou_3b7e…9d2'} };

/* ═══════ 项目 ═══════
   past: 已归档定住(旧→新)  now: 未闭环的当前段  future: 未来关键动作 */
const P = {
'diffusion-ablation': {
  one:'做扩散模型结构消融的系统研究,目标 ICML\'27 投稿。',
  focus:'搞清楚哪些结构组件真正贡献了性能 —— 现在实验做完了,卡在数据可信度上。',
  people:['you'], kind:'ICML 投稿', ddl:'07-29', ddlDays:5, start:'07-05',
  acc:'71.3 → 69.2',
  past:[
    {d:'07-05',t:'m',x:'项目启动,目标 ICML\'27',why:'确定选题与 ddl。',data:'ICML 投稿截止 07-29。',when:'07-05 20:00 · mbp-office · 会话「开题」'},
    {d:'07-08',t:'d',x:'主干模型定为 DiT-B/2',why:'算力预算下能跑完全部 12 组消融的最大模型。',data:'B/2 单组约 6 小时,B/4 需 22 小时,ddl 内跑不完。',when:'07-08 09:15 · mbp-office · 会话「选型」'},
    {d:'07-10',t:'d',x:'合并三个 shard 数据集 ← 后来查出是泄漏来源',why:'单 shard 样本量不足以支撑消融的统计显著性。',data:'合并后 128k 样本;当时未做跨 shard 去重 —— 正是 07-23 查出的 12 条重复的来源。',when:'07-10 14:20 · aws-dev · 会话「数据准备」',commit:'merge_shards.py'},
    {d:'07-12',t:'m',x:'基线复现达标(acc 71.3)',why:'与原论文的 71.5 差 0.2,进入可比区间,消融才有意义。',data:'三次独立重跑:71.1 / 71.3 / 71.4。',when:'07-12 19:47 · aws-dev · 会话「基线复现」',commit:'c04a8e1'},
    {d:'07-15',t:'d',x:'数据增强只用 flip,不做 color jitter',why:'扩散模型对颜色分布敏感,jitter 会污染消融的因果解释。',data:'预实验:加 jitter 后基线波动从 0.3 涨到 1.1 点。',when:'07-15 11:30 · mbp-office · 会话「增强策略」'},
    {d:'07-19',t:'m',x:'消融流水线跑通,可批量出结果',why:'每组消融从手工三步变成一条命令。',data:'首批 exp-030~036 七组一次跑完,无人工介入。',when:'07-19 22:15 · aws-dev · 会话「pipeline 收尾」',commit:'7b2e0d4'},
    {d:'07-21',t:'d',x:'放弃 cosine 调度对比',why:'与消融主线无关,属于可有可无的补充实验。',data:'预跑两组差异 <0.2 点,没有结论价值。',when:'07-21 15:08 · mbp-office · 会话「实验计划裁剪」'},
    {d:'07-23',t:'d',x:'batch size 固定 256,不再扫参',why:'显存打满时 256 是最大稳定值;继续扫参的边际收益低于 ddl 压力。',data:'exp-037~040 四组对比,256 与 512 相差 0.3 点,在噪声范围内。',when:'07-23 10:42 · mbp-office · 会话「参数扫描收尾」',commit:'a91c3f2'},
  ],
  now:{ title:'消融结果反常 → 数据可信度排查', from:'07-23 10:42(上一个定点之后)',
    run:[{x:'<code>fix/dedup</code> 分支排查泄漏范围',m:'agent · aws-dev · 已跑 6 小时,未回报'}],

  const li=(cls,g,it,extra='')=>`<div class="li ${cls}"><span class="g">${g}</span><div class="body">
      <div>${it.x}</div><div class="meta">${it.m}</div>${extra}</div></div>`;
  const decBlock = it => it.dec ? `<div class="opts">${it.dec.opts.map(o=>`<div class="opt">
      <div class="t">${o.t}${o.rec?'<span class="rec">agent 倾向</span>':''}</div><div class="d">${o.d}</div></div>`).join('')}</div>
      <div class="meta" style="margin-top:6px">${it.dec.why}</div>
      <div class="ax"><button class="btn p" onclick="toast('样机未接线;正式版记录裁决并把这段推进到下一步')">选第一条</button>
        <button class="btn" onclick="toast('样机未接线')">选第二条</button>
        <button class="btn" onclick="toast('样机未接线;正式版让 agent 补充材料再定')">让 agent 再查查</button></div>` : '';
  const pingBlock = it => it.ping ? `<div class="ax"><button class="btn" onclick="askPing('${it.ping}')">让秘书催一下</button>
      <button class="btn" onclick="feishu('${it.ping}')">打开飞书</button></div>` : '';
  const sec=(title,arr,cls,g,ex)=> arr.length?`<div class="grp"><h3>${title} <span class="c">${arr.length}</span></h3>
      ${arr.map(it=>li(cls,g,it,ex?ex(it):'')).join('')}</div>`:'';

  document.getElementById('pane').innerHTML=`<div class="doc">
    ${bandHtml()}
    ${projHead(k)}
    ${recapFull(k)}
    <div class="crumb">时间线 · 上一个定点 <a href="#" onclick="openNode('${k}','past',${p.past.length-1});return false">${last.d} ${last.x}</a> 之后 ——</div>
    <div class="seg-h"><h2>${n.title}</h2>
      <span class="act"><button class="btn p" onclick="closeSeg('${k}')">这段闭环了 · 归档</button></span></div>
    <div class="seg-meta">起于 ${n.from} · ${openCount(k)} 项未闭环 · 归档后它会变成时间线上的一个定点</div>
    ${sec('卡住 · 等你',n.block,'block','⛔',it=>decBlock(it)+pingBlock(it))}
    ${sec('进行中',n.run,'run','⏳')}
    ${sec('agent 称已完成 · 待你验收',n.verify,'verify','✓?',()=>`<div class="ax">
        <button class="btn" onclick="toast('样机未接线;正式版标记为已验收,并入下次归档')">我验收了</button>
        <button class="btn" onclick="toast('样机未接线;正式版把它退回给 agent 并附上你的理由')">不对,退回</button></div>`)}
    ${sec('还没开始',n.todo,'todo','○')}
    <div class="grp"><h3>你上次的想法</h3><p class="quote" style="margin:0">${n.think}</p></div>
    <div class="tail">这一段的依据:<a class="ev" href="#" onclick="toast('样机未接线;正式版深链到会话浏览器');return false">${n.ev} ↗</a>
      · 源文件 <code>hq/projects/${k}/state.md</code></div>
  </div>`;
  renderRail(); syncChat(); document.getElementById('pane').scrollTop=0;
}

function openNode(k,g,i){
  ST.view='project'; ST.proj=k; ST.node={g,i};
  const p=P[k], e=(g==='past'?p.past:p.future)[i];
  const body = g==='past'
    ? `<div class="dr"><span class="dk">为什么</span><span>${e.why}</span></div>
       <div class="dr"><span class="dk">依据</span><span>${e.data}</span></div>
       <div class="dr"><span class="dk">何时</span><span>${e.when}
         <a class="ev" href="#" onclick="toast('样机未接线;正式版深链到这场 agent 会话的这一段');return false">打开会话 ↗</a></span></div>
       ${e.commit?`<div class="dr"><span class="dk">提交</span><span><code>${e.commit}</code>
         <a class="ev" href="#" onclick="toast('样机未接线;正式版跳 git 提交');return false">↗</a></span></div>`:''}`
    : `<div class="dr"><span class="dk">为什么</span><span>${e.why}</span></div>
       <div class="dr"><span class="dk">前置</span><span>${e.dep}</span></div>
       <div class="dr"><span class="dk">时间</span><span>${e.d}</span></div>`;
  document.getElementById('pane').innerHTML=`<div class="doc">
    ${bandHtml()}
    ${projHead(k)}
    <div class="recap slim"><div class="r"><span class="k">一句话</span><span>${p.one}</span></div></div>
    <div class="crumb"><a href="#" onclick="openNow('${k}');return false">← 回到当前段</a> · 时间线 ${g==='past'?'过去':'未来'}</div>
    <div class="seg-h"><h2>${g==='past'?(e.t==='m'?'✦ ':'● '):(e.t==='ddl'?'◇ ':'○ ')}${e.x}</h2></div>
    <div class="seg-meta">${g==='past'?'已归档 · 定住不再改':'计划中 · 未发生'}</div>
    ${body}
    <div class="tail">${g==='past'
      ? '这是时间线上的一个定点。若发现记错了,在右边告诉秘书,它会追加一条「事实变更」而不是抹掉原记录。'
      : '未来项是简化规划,不是承诺。落地时它会成为「当前段」,闭环后归档成定点。'}</div>
  </div>`;
  renderRail(); syncChat(); document.getElementById('pane').scrollTop=0;
}

/* 闭环归档:当前段并入时间线,成为新的定点 */
function closeSeg(k){
  const p=P[k], n=p.now, open=openCount(k);
  if(open>0 && !confirm(`${k} 还有 ${open} 项未闭环(卡住 ${n.block.length} · 进行中 ${n.run.length} · 待验收 ${n.verify.length} · 未开始 ${n.todo.length})。\n\n仍然归档?正式版会把未闭环的项转成新一段的起点。`)) return;
  p.past.push({d:'07-24',t:'m',x:n.title+'(你已验收)',
    why:'你在 07-24 确认这一段闭环,agent 的交付被采信。',
    data:[...n.verify,...n.run].map(x=>x.x.replace(/<[^>]+>/g,'')).join(' · ')||'—',
    when:'07-24 · 秘书会话(本次对话)'});
  p.now={title:'(新一段尚未开始)',from:'07-24 归档之后',run:[],verify:[],block:[],todo:[],
    think:'(等下一次推进)',ev:'—'};
  push('a',`<code>${k}</code> 的当前段已归档成时间线定点(07-24)。<br>
    未闭环的项我没丢 —— 正式版会把它们转成新一段的起点。<br>
    这条归档同时写进了 <code>state.md</code>。`);
  openNow(k);
  document.querySelectorAll('.tnode.mile').forEach(e=>e.classList.add('flash'));
}

/* ═══════ 右栏 ═══════ */
function syncChat(){
  document.getElementById('chat-ctx').innerHTML = ST.view==='brief'
    ? '上下文:<code>今日简报</code> · 昨夜消化这一页的那个会话'
    : '上下文:<code>'+ST.proj+'</code> · '+(ST.node.g==='now'?'当前段':(ST.node.g==='past'?'过去定点':'未来项'));
  renderChips();
}
const SCRIPTS={
 acc:{u:'exp-043 的 acc 是 69.8 不是 69.2,你读错列了',
  a:`对不住 —— 我从 <code>exp-043/eval.log</code> 第 3 列读的,那列是 EMA 权重的结果,不是最终验证集。已改正。<br>
     差值从 -2.1 修正为 <b>-1.5</b>。<b>不影响</b>「疑似泄漏」的判断:那条来自 md5 比对,与这个数无关。`,
  wrote:'当前段 1 处 · 今日简报 1 处',act:()=>{ P['diffusion-ablation'].acc='71.3 → 69.8';
    refresh(); document.querySelectorAll('.accspot').forEach(e=>e.classList.add('flash')); }},
 ddl:{u:'survey 的 ddl 推到 8/3 了',

    refresh(); document.querySelectorAll('[data-people="survey-agents"]').forEach(e=>e.classList.add('flash')); }},
 verify:{u:'rlhf 那段我在自己机器上跑过了,没问题',

     <div style="margin-top:6px"><span class="who-chip" onclick="closeSeg('rlhf-env')">现在归档</span>
     <span class="who-chip ghost" onclick="toast('样机未接线;正式版等 flaky 出结果后提醒你')">等测试绿了</span></div>`,
  wrote:'当前段 2 项标记已验收',act:()=>{ if(ST.proj!=='rlhf-env') openNow('rlhf-env'); }},

  a:`07-23 16:40 那场会话(mbp-office):对 val 全量算 md5,与 train 的哈希集合求交,命中 12 条。<br>

     <a class="ev" href="#" onclick="toast('样机未接线;正式版跳会话原文这一段');return false">看那段原文 ↗</a>`,wrote:null,act:null},

function chipsFor(){
  if(ST.view==='brief') return ['ddl','verify','ping'];
  if(ST.proj==='diffusion-ablation') return ['acc','ev'];
  if(ST.proj==='survey-agents') return ['ddl','people'];
  if(ST.proj==='rlhf-env') return ['verify','ev'];
  return ['ping','ev'];
}
function renderChips(){ document.getElementById('chips').innerHTML=
  chipsFor().map(k=>`<button class="chip" onclick="run('${k}')">${SCRIPTS[k].u}</button>`).join(''); }
function push(r,html){ CHAT.push({r,html}); paint(); }
function paint(){ document.getElementById('msgs').innerHTML=CHAT.map(m=>m.r==='u'
   ?`<div class="m u">${m.html}</div>`:`<div class="m a"><span class="who">秘书</span>${m.html}</div>`).join('');
  const el=document.getElementById('msgs'); el.scrollTop=el.scrollHeight; }
function run(k){ const s=SCRIPTS[k];
  if(!s.a){ s.act(); return; }
  push('u',s.u);
  setTimeout(()=>{ let h=s.a;
    if(s.wrote) h+=`<div class="wrote"><span class="h">✎ 已写入</span> ${s.wrote} ·
      <a href="#" onclick="toast('样机未接线;正式版撤销这次改动');return false">撤销</a></div>`;
    push('a',h); if(s.act) s.act(); },420); }
function send(){ const i=document.getElementById('inp'),v=i.value.trim(); if(!v) return;
  i.value=''; push('u',v.replace(/</g,'&lt;'));
  setTimeout(()=>push('a','🎭 样机里我只会演几段固定对话 —— 点下面的气泡试试。正式版这里是昨夜消化这一页的那个 agent,会话还活着,能读 <code>hq/</code> 下的文件和它引用过的会话原文。'),420); }

function refresh(){ ST.view==='brief'?showBrief():(ST.node.g==='now'?openNow(ST.proj):openNode(ST.proj,ST.node.g,ST.node.i)); }
function setTime(t){ ST.time=t;
  document.querySelectorAll('.tt button').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); refresh(); }
let tid; function toast(m){ const t=document.getElementById('toast'); t.textContent='🎭 '+m;
  t.classList.add('show'); clearTimeout(tid); tid=setTimeout(()=>t.classList.remove('show'),3600); }
document.addEventListener('keydown',e=>{
  if(document.activeElement.id==='inp') return;
  if(e.key==='Escape') showBrief();
  if(e.key==='j'||e.key==='k'){ const i=ST.proj?ORDER.indexOf(ST.proj):-1;
    openNow(ORDER[e.key==='j'?Math.min(i+1,ORDER.length-1):Math.max(i-1,0)]); }
});

showBrief();
push('a',`昨夜 02:30 消化完 9 场会话,这一页是我写的。有一处我<b>不太确定</b>,先说在前面:

  另外 mbp-lht 昨夜离线,它上面的会话没纳入。`);
