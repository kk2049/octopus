# Session Plus — reverse-proxy contract, as copyable snippets.
#
# NOT applied anywhere. The live proxy config on this host is root-owned
# (`/etc/caddy/Caddyfile`) and is deliberately out of scope for the M0/M1 task;
# this file is the checked-in source an operator copies from, so the contract
# lives in the repository next to the code that depends on it.
#
# The contract, in five lines:
#
#   1. Two hostnames, two upstreams: the control plane (9820) and the Agent
#      View (9821). They must NOT be the same host — cookies are scoped by HOST
#      (not by origin, and not by port), so a View served from the panel's
#      hostname receives the panel's cookies on the request that fetches it and
#      on every self-navigation after that. The frame's SCRIPT could not read
#      them (an `allow-scripts` sandbox has an opaque origin), but they would
#      have already left the browser.
#   2. Pass the Host header through unchanged. The view listener validates it
#      against the digest hostname it was configured with and answers 421 when
#      it does not match, so a proxy that rewrites Host makes the deployment
#      fail loudly instead of serving the package under a name that no longer
#      describes it.
#   3. Strip `Set-Cookie` from the App origin's responses. The server never
#      sends one; this is depth, so that no future middleware or misconfiguration
#      can start giving that hostname a cookie jar.
#   4. Add no `Access-Control-Allow-*` header. There is no API on that origin to
#      share, and the view's CSP (`connect-src 'none'`) means it could not call
#      one anyway.
#   5. Turn App-host access logging OFF. `connect-src 'none'` blocks
#      fetch/XHR/WebSocket/EventSource, but it does not stop a sandboxed frame
#      navigating ITSELF (measured in Chromium; `navigate-to` is unrecognised
#      there, so there is no directive to add). The whole request target is
#      attacker-chosen — `/?leak=secret` and `/leak-is-the-path` carry a value
#      equally well — so a "path-only" log is NOT a safe middle ground: it
#      records the path, and the path is a channel. The listener answers 404 to
#      every non-document target and records none of them; an access log here
#      would rebuild the exfiltration sink it just refused to be. If some metric
#      is unavoidable, it must be request-target-free (a count, a status code).
#
# The hostname's first label is `app-<first 20 hex of the package digest>` —
# print the current one with the startup log line
# `session-plus agent view listening`, or read `inventory.sessionPlus`.
#
# DNS: `bot.<domain>` and a wildcard `*.apps.<domain>`, both to this host. The
# wildcard is what lets a new build's digest hostname resolve without a DNS
# change on every deploy; certificates come from a wildcard cert or on-demand
# issuance.

# ───────────────────────────── Caddy ──────────────────────────────
# Append to /etc/caddy/Caddyfile, then: sudo systemctl reload caddy
# (Back the file up first — the live one serves other sites.)

bot.example.org {
	reverse_proxy 127.0.0.1:9820
}

# One site block per served package digest. Naming the exact hostname rather
# than `*.apps.example.org` keeps "which package is published" an explicit,
# reviewable edit — the same reason the CSP never uses a wildcard.
app-REPLACE_WITH_PACKAGE_DIGEST_20.apps.example.org {
	# Caddy forwards the original Host by default; make it explicit so a future
	# edit cannot silently drop it.
	reverse_proxy 127.0.0.1:9821 {
		header_up Host {host}
	}
	# The request TARGET — path and query alike — is the exfiltration channel the
	# listener refuses to record. An access log would preserve exactly what it
	# refused to keep, so this origin logs nothing.
	log {
		output discard
	}
	header {
		# Depth: the App origin has no session and must never acquire one.
		-Set-Cookie
		# There is no API here to share.
		-Access-Control-Allow-Origin
		-Access-Control-Allow-Credentials
	}
}

