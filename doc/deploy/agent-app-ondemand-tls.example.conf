# Agentic App origins with on-demand TLS — the hot-update reverse-proxy shape.
#
# Applied on this host on 2026-08-06 by merging the global `ask` policy and the
# wildcard App site into `/etc/caddy/Caddyfile`; Caddy 2.11.4 validated it before
# a graceful reload. The pre-change live file is backed up at
# `/etc/caddy/Caddyfile.before-agent-hot-20260806T171434Z`. This checked-in file
# remains the reviewable template for other hosts. Read
# `doc/deploy/session-plus-proxy.example.conf` first — every rule in it (pass
# Host through, strip Set-Cookie, no CORS, no access log) still holds. This file
# changes exactly one thing: how a NEW release's hostname starts being served.
#
# ── The problem this replaces ───────────────────────────────────────────────
#
# The single-release shape writes one site block per package digest:
#
#     app-a74cf19708be421842fa.apps.example.org { reverse_proxy 127.0.0.1:9821 }
#
# That is correct and reviewable, and it means publishing a new release requires
# a root edit and a `systemctl reload` — which makes "activate a release without
# restarting anything" impossible in practice. On-demand TLS removes the edit.
#
# ── Why `ask` is not optional ───────────────────────────────────────────────
#
# With on-demand issuance and no `ask`, Caddy will try to obtain a certificate
# for ANY name that resolves to this machine and arrives in SNI. That is both a
# way to burn the CA's rate limit and a way to make this host answer to names
# nobody chose. `ask` points at a loopback endpoint the bot serves
# (`session_plus.origin_ask_port`), which answers 200 only for
# `app-<20 lowercase hex>.<app_domain>` where the label is a release the registry
# currently has installed — no DNS lookup, no wildcard, no body, and the name is
# never logged (it is attacker-chosen: it arrives in SNI).
#
# The bot refuses to bind that endpoint anywhere but loopback: it answers "which
# releases exist on this host", and a routable one is an enumeration API.
#
# ── Bot configuration this pairs with ───────────────────────────────────────
#
#     session_plus:
#       enabled: true
#       app_domain: apps.example.org     # NOT view_origin — that form pins one release
#       view_port: 9821
#       origin_ask_port: 9822           # loopback only
#
# `view_origin` and `app_domain` are mutually exclusive and the bot refuses both.
# `view_origin` pins the hostname to one release, which is right for a
# deployment with one hand-written site block and wrong for this one — activating
# a different release under a pinned origin is refused, loudly, with the reason.
#
# ── DNS ─────────────────────────────────────────────────────────────────────
#
# Two A records, both confirmed on 2026-08-06 against the authoritative servers
# (AliDNS `vip1.alidns.com`), this host's own resolver, `1.1.1.1` and `8.8.8.8`:
#
#     *.apps.example.org   A   203.0.113.8      ← what digest hostnames need
#     apps.example.org     A   203.0.113.8      ← diagnostics / an explicit answer
#
# The wildcard is what makes a new release resolvable without a DNS change; the
# bare name is not used by any release and is there so a probe of the zone gets a
# deliberate answer rather than NXDOMAIN. (An earlier empty result for the bare
# name was a negative cache entry from just before the record was created, not a
# missing record.)
#
# The wildcard is ONLY a resolution shortcut. Which names actually get served is
# decided in three places that all fail closed: `ask` against the registry, the
# listener's exact `Host` → digest-label match, and the panel's exact `frame-src`.
#
# **The domain stays configuration.** `session_plus.app_domain` is what makes it
# so; nothing in the code or the tests contains `example.org`, and no test resolves
# a real name.
#
# ── Cookies: the risk of owning the parent domain, and the existing defences ──
#
# `bot.example.org` and `app-<digest>.apps.example.org` are different ORIGINS but
# the same SITE (same registrable domain). That distinction matters twice:
#
#  · **A sibling host under `example.org` could try to SET a cookie for the whole
#    domain** (`Domain=.example.org`) and thereby fix a session on the panel. The
#    defence is the `__Host-` prefix on the panel's session and CSRF cookies: a
#    browser refuses any same-named cookie that carries a `Domain` attribute at
#    all. The panel therefore never sets `Domain=`, and `web-trust`'s serialiser
#    throws rather than emitting one — including on deletion, where a dropped
#    `Secure` would leave the cookie in the jar.
#  · **The App origin must never acquire a cookie jar of its own.** The listener
#    sends no `Set-Cookie` ever, counts any request that arrives WITH a cookie
#    (`stats.withCookies`, expected to stay 0 forever), and the proxy strips
#    `Set-Cookie` from that origin as depth.
#
# What is NOT claimed: same-site is not isolation. The boundary is the opaque
# origin of the sandboxed frame plus `connect-src 'none'` plus the MessagePort
# contract — the domain layout is one more lock, not the lock.

# ───────────────────────────── Caddy ──────────────────────────────
# Back up /etc/caddy/Caddyfile first; the live file serves other sites.
#   sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%F)
#   sudo vi /etc/caddy/Caddyfile        # append the blocks below
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy         # graceful; existing connections finish
# Roll back: restore the .bak file and reload again. Nothing in the bot has to
# change to roll back the proxy — the App origin simply stops resolving, and the
# panel says the frame is unavailable.

{
	# Merge this option into the ONE global block at the top of an existing
	# Caddyfile; Caddy permits at most one. Current Caddy deliberately relies on
	# the fast indexed `ask` decision here: the old `interval`/`burst` knobs are
	# deprecated and explicitly not recommended by the upstream documentation.
	on_demand_tls {
		ask http://127.0.0.1:9822/ask
	}
}

bot.example.org {
	reverse_proxy 127.0.0.1:9820
}

# One block for every release, present and future. `on_demand` is what makes the
# certificate appear at first request; `ask` is what stops that from applying to
# any other name under the wildcard.
*.apps.example.org {
	tls {
		on_demand
	}
	reverse_proxy 127.0.0.1:9821 {
		# The listener validates this against the digest label and answers 421 on
		# a mismatch, so a proxy that rewrites Host fails loudly rather than
		# serving a package under a name that does not describe it.
		header_up Host {host}
	}
	# The request TARGET — path and query alike — is the one channel a sandboxed
	# frame retains (it can navigate ITSELF). The listener answers 404 to every
	# non-document target and records none of them; an access log here would
	# rebuild exactly the sink it refuses to be.
	log {
		output discard
	}
	header {
		-Set-Cookie
		-Access-Control-Allow-Origin
		-Access-Control-Allow-Credentials
	}
}

# ────────── the one-time migration from the two exact sslip.io blocks ────────
#
# Before the 2026-08-06 migration, the live proxy had TWO exact site blocks of
# the form `app-<20hex>.apps.16-58-204-8.sslip.io`, one per release that had been
# published by hand. This host currently keeps those exact blocks beside the new
# wildcard as the configuration-level rollback path. Moving another host to the
# shape above is a single operator action, and the order below exists so that
# every step is reversible on its own.
#
#   1. **Back up, and keep the backup.**
#        sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%F-%H%M)
#
#   2. **Merge the new policy; do not duplicate existing blocks.** Put
#      `on_demand_tls { ask ... }` inside the ONE existing top-level global block
#      (create it only when the file has none), leave the existing
#      `bot.example.org` block untouched, and add only the new
#      `*.apps.example.org` site block. Do not delete the old exact App blocks yet.
#
#   3. **Change the bot's configuration in the same window**, because this is the
#      step that decides which origin the panel will frame:
#        session_plus:
#          app_domain: apps.example.org     # replaces view_origin
#          app_scheme: https
#          origin_ask_port: 9822
#      Remove `view_origin`. Configuring both is refused at startup, and that
#      refusal is the point: `view_origin` PINS one release, so leaving it in
#      place would make the first activation fail with a message about a pinned
#      origin rather than serving from the new name.
#
#      **Do not leave the old sslip.io names in `frame-src` or in any config the
#      panel reads.** One release must not have two identity origins in trusted
#      configuration at the same time: the whole guarantee is that the label in
#      the address bar names the package, and two names for one package is
#      exactly the ambiguity that guarantee removes. The old SITE BLOCKS staying
#      in the Caddyfile is a different thing — nothing points at them any more,
#      and they are there only so step 6 can be skipped for a while.
#
#   4. **Validate, then reload gracefully.**
#        sudo caddy validate --config /etc/caddy/Caddyfile
#        sudo systemctl reload caddy     # in-flight connections finish
#
#   5. **Accept it** (the commands are in the next section, plus these):
#        · a certificate is issued for the ACTIVE release's hostname on first
#          request, and NOT for a random `app-*` name that is not installed;
#        · the panel page's CSP `frame-src` names exactly the new origin — read
#          it off the response header, do not infer it;
#        · the App origin sets no cookie and receives none
#          (`stats.withCookies` stays 0);
#        · the panel's own login still works and its cookies are still
#          `__Host-`-prefixed with no `Domain`;
#        · a bad hostname under the same domain (`app-000….apps.example.org`,
#          `www.apps.example.org`) is refused rather than served.
#
#   6. **Only after it has been stable**, delete the two exact sslip.io site
#      blocks and reload again. Until then they are the configuration-level
#      rollback: restoring `view_origin` in the bot's config points the panel
#      back at a name the proxy still serves.
#
# Rollback at any point before step 6: restore the `.bak` Caddyfile, put
# `view_origin` back in the bot config, restart the bot. The registry's active
# pointer is untouched by all of this — which release is running and which name
# it is served under are two different decisions, and only the second one is
# being migrated here.

# ───────────────────── verifying it, before trusting it ─────────────────────
#
#   # 1. The ask endpoint says yes only for installed releases.
#   curl -s -o /dev/null -w '%{http_code}\n' \
#     'http://127.0.0.1:9822/ask?domain=app-<installed 20 hex>.apps.example.org'   # 200
#   curl -s -o /dev/null -w '%{http_code}\n' \
#     'http://127.0.0.1:9822/ask?domain=evil.apps.example.org'                     # 403
#   curl -s -o /dev/null -w '%{http_code}\n' \
#     'http://127.0.0.1:9822/ask?domain=bot.example.org'                           # 403
#
#   # 2. It is not reachable from outside. Expect a refused connection.
#   curl -s -m 3 'http://<public ip>:9822/ask?domain=x' ; echo "exit=$?"
#
#   # 3. The active release's origin serves one document and nothing else.
#   curl -sI https://app-<active 20 hex>.apps.example.org/            # 200
#   curl -sI 'https://app-<active 20 hex>.apps.example.org/?leak=x'   # 404
#   curl -sI https://app-<uninstalled 20 hex>.apps.example.org/       # 404 (or TLS refused)
#
# ── What is deliberately NOT here ───────────────────────────────────────────
#
#  · No Caddy admin API access for the bot. The bot never edits proxy config and
#    holds no credential that could; the only thing it does is answer a
#    yes/no question on loopback.
#  · No wildcard certificate. A wildcard cert for `*.apps.<domain>` would work
#    and would also be one file that authenticates every name under it — which is
#    the opposite of "the hostname names the package".
#  · No `ask` over anything but loopback plain HTTP. It carries no secret, and
#    putting TLS on it would add a certificate that has to be valid before the
#    thing that issues certificates can ask a question.
